name: codec-z3-search

on:
  workflow_dispatch:
    inputs:
      timeout_ms:
        description: Z3 timeout in milliseconds; 0 means no solver timeout
        required: true
        default: "0"
  push:
    branches:
      - codex/codec-z3-search

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install z3
        run: python -m pip install z3-solver
      - name: Run complete affine-layer search
        run: python scripts/codec_z3_search.py "${{ github.event.inputs.timeout_ms || '0' }}" | tee codec-z3.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codec-z3-log
          path: codec-z3.log
