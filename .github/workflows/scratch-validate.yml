name: scratch-validate

on:
  push:
    branches:
      - codex/gcd-scratch-1349
  workflow_dispatch:
    inputs:
      note:
        description: Benchmark note
        required: true
        default: codex gcd scratch lane validation

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BENCH_NOTE: ${{ github.event.inputs.note || 'codex gcd scratch lane validation' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: scratch-validate-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain') }}
      - name: Show toolchain
        run: rustup show
      - name: Setup benchmark
        run: ./setup.sh
      - name: Run benchmark
        run: |
          rm -f ops.bin score.json
          ./target/release/build_circuit
          ./target/release/eval_circuit --note "$BENCH_NOTE"
      - name: Show score
        if: always()
        run: |
          test -f score.json && cat score.json || true
          test -f results.tsv && tail -n 5 results.tsv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scratch-validation-results
          path: |
            score.json
            results.tsv
